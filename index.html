<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Question of the Day</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#172033}
header{background:#fff;padding:18px 24px;border-bottom:2px solid #d7dce2}h1{font-size:clamp(28px,4vw,46px);margin:0 0 8px}#instruction{font-size:clamp(18px,2.4vw,28px);margin:0}
main{max-width:1400px;margin:auto;padding:20px}.section-title{font-size:clamp(22px,2.8vw,32px);font-weight:bold;margin:8px 0 14px}
.names{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.name{min-height:72px;border:3px solid #aeb7c2;border-radius:16px;background:white;font-size:22px;font-weight:bold;cursor:pointer;touch-action:manipulation}.name.selected{background:#dbeafe;border-color:#2563eb}.name.answered{background:#e9edf2}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.choice{min-height:240px;border:4px solid #aeb7c2;border-radius:22px;background:white;font-size:28px;font-weight:bold;cursor:pointer;padding:18px;touch-action:manipulation}.choice:active,.name:active{transform:scale(.98)}
.visual{font-size:72px;margin-bottom:10px}.people{margin-top:12px;display:flex;flex-wrap:wrap;gap:7px;justify-content:center}.person{font-size:18px;background:#eef1f4;border:2px solid #aeb7c2;border-radius:10px;padding:6px 9px}
.controls{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}button.control{min-height:54px;border:2px solid #aeb7c2;border-radius:14px;background:white;padding:10px 18px;font-size:18px;font-weight:bold;cursor:pointer}
#staff{margin-top:24px;background:white;border:2px solid #d1d7de;border-radius:16px;padding:18px}#staff summary{font-size:20px;font-weight:bold;cursor:pointer}
.formgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-top:15px}label{font-weight:bold}input{display:block;width:100%;margin-top:5px;padding:12px;font-size:18px;border:2px solid #b9c1ca;border-radius:10px}
.status{margin-top:18px;text-align:center;font-size:21px;font-weight:bold;min-height:30px}
@media(max-width:800px){.choices{grid-template-columns:repeat(2,1fr)}}@media(max-width:520px){.choices{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.names{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><h1 id="question">Would you rather be a mad scientist or a wizard?</h1><p id="instruction">First tap a person's name. Then tap their answer.</p></header>
<main>
<div class="section-title">1. Tap your name</div><div class="names" id="names"></div>
<div class="section-title">2. Tap your answer</div><div class="choices" id="choices"></div>
<div class="status" id="status" aria-live="polite">No one is selected.</div>
<div class="controls"><button class="control" id="undo">↩ Undo Last Answer</button><button class="control" id="clear">↻ Clear All Answers</button></div>
<details id="staff"><summary>⚙ Staff Setup — change today's question and choices</summary>
<div class="formgrid">
<label>Question<input id="q" value="Would you rather be a mad scientist or a wizard?"></label>
<label>Choice 1<input id="c1" value="🧪 Mad Scientist"></label><label>Choice 2<input id="c2" value="🪄 Wizard"></label>

</div><div class="controls"><button class="control" id="apply">Apply New Question</button></div>
</details>
</main>
<script>
const members = ['Sergio', 'Patrick J', 'Liaaa', 'Sanjula', 'Julianna', 'Kaitlyn', 'Jackson', 'Margret', 'Stacy', 'Katy', 'Steve', 'Jordan', 'Gabby', 'Monica M', 'Therese', 'Cole', 'Nathan', 'Liz', 'Monica V', 'Patrick E', 'Kieran', 'Sherry'];
let selected=null,answers=new Map(),history=[];
const namesEl=document.getElementById("names"), choicesEl=document.getElementById("choices"), statusEl=document.getElementById("status"), instructionEl=document.getElementById("instruction"), questionEl=document.getElementById("question");

function buildNames(){
 namesEl.innerHTML="";
 members.forEach((name,index)=>{
  const b=document.createElement("button"); b.type="button"; b.className="name"; b.textContent=name;
  b.dataset.id=String(index);
  b.addEventListener("click",()=>{
   selected=index;
   document.querySelectorAll(".name").forEach(x=>x.classList.remove("selected"));
   b.classList.add("selected");
   statusEl.textContent=name+" is selected. Now tap an answer.";
   instructionEl.textContent="Now tap an answer for "+name+".";
  });
  namesEl.appendChild(b);
 });
}
function getChoices(){return [1,2].map(i=>document.getElementById("c"+i).value.trim()||"Choice "+i)}
function renderChoices(){
 const choices=getChoices(); choicesEl.innerHTML="";
 choices.forEach(choice=>{
  const card=document.createElement("button"); card.type="button"; card.className="choice";
  const m=choice.match(/^(\S+)\s+(.+)$/); const visual=m?m[1]:"✓", text=m?m[2]:choice;
  card.innerHTML='<div class="visual">'+visual+'</div><div>'+text+'</div><div class="people"></div>';
  card.addEventListener("click",()=>{
   if(selected===null){statusEl.textContent="Please tap a person's name first.";return}
   const old=answers.get(selected);
   history.push({id:selected,old:old});
   answers.set(selected,choice);
   statusEl.textContent=members[selected]+" chose "+choice+".";
   selected=null;
   document.querySelectorAll(".name").forEach(x=>x.classList.remove("selected"));
   instructionEl.textContent="Tap the next person's name, then their answer.";
   renderChoices(); updateNameStyles();
  });
  choicesEl.appendChild(card);
 });
 answers.forEach((choice,id)=>{
  const i=choices.indexOf(choice);
  if(i>=0){const tag=document.createElement("span");tag.className="person";tag.textContent=members[id];choicesEl.children[i].querySelector(".people").appendChild(tag)}
 });
}
function updateNameStyles(){
 document.querySelectorAll(".name").forEach(b=>b.classList.toggle("answered",answers.has(Number(b.dataset.id))));
}
document.getElementById("undo").addEventListener("click",()=>{
 const last=history.pop(); if(!last){statusEl.textContent="Nothing to undo.";return}
 if(last.old===undefined)answers.delete(last.id);else answers.set(last.id,last.old);
 selected=last.id;
 document.querySelectorAll(".name").forEach(b=>b.classList.toggle("selected",Number(b.dataset.id)===selected));
 statusEl.textContent="Choose a new answer for "+members[selected]+".";
 renderChoices();updateNameStyles();
});
document.getElementById("clear").addEventListener("click",()=>{
 if(!confirm("Clear all answers for today's question?"))return;
 answers.clear();history=[];selected=null;
 document.querySelectorAll(".name").forEach(b=>b.classList.remove("selected","answered"));
 statusEl.textContent="All answers cleared.";instructionEl.textContent="First tap a person's name. Then tap their answer.";renderChoices();
});
document.getElementById("apply").addEventListener("click",()=>{
 questionEl.textContent=document.getElementById("q").value.trim()||"Question of the Day";
 answers.clear();history=[];selected=null;
 statusEl.textContent="New question ready!";instructionEl.textContent="First tap a person's name. Then tap their answer.";renderChoices();updateNameStyles();
});
buildNames();renderChoices();
</script>
</body>
</html>
